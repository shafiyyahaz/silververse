<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Silververse 2.0 — an interactive collection of musical, focus, mood and dream worlds.">
  <title>Silververse 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="aurora a1" aria-hidden="true"></div>
  <div class="aurora a2" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Silververse home">
      <span class="brand-orb">✦</span>
      <span><b>SILVER</b>VERSE<small>2.0</small></span>
    </button>
    <nav id="worldNav" aria-label="World navigation"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="profileBtn" title="Profile">◉</button>
      <button class="icon-btn" id="themeBtn" title="Theme Studio">◈</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="teleport" id="teleport" aria-hidden="true">
    <div class="teleport-ring"></div><div class="teleport-core">✦</div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sound-dot" id="soundDot" title="Sound effects">♪</div>

  <script src="script.js"></script>
</body>
</html>
