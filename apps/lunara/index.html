<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunara — Mood Journal</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../index.html">← Back to Silververse</a><header><div class="moon">☾</div><div><p>LUNARA · MOOD JOURNAL</p><h1>A little space<br><span>for your thoughts.</span></h1><div class="intro">Check in with your mood, write a few words, and keep gentle memories in your browser.</div></div></header><section class="grid"><article class="card"><small>TODAY'S CHECK-IN</small><h2>How are you feeling?</h2><div id="moods" class="moods"><button data-mood="Happy">☀️<b>Happy</b></button><button data-mood="Calm">🌙<b>Calm</b></button><button data-mood="Okay">☁️<b>Okay</b></button><button data-mood="Tired">🌧️<b>Tired</b></button><button data-mood="Excited">✨<b>Excited</b></button></div><label>A few words about today</label><textarea id="note" maxlength="500" placeholder="Write anything you'd like to remember..."></textarea><div class="row"><span id="count">0 / 500</span><button id="save" class="primary">Save check-in</button></div><div id="saved"></div></article><article class="card"><div class="row"><div><small>YOUR SPACE</small><h2>Recent moments</h2></div><button id="clear" class="ghost">Clear all</button></div><div id="entries"></div></article></section><footer>Private on this browser · No account required</footer></main><script src="app.js"></script></body></html>
